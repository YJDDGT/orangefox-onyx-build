name: Build OrangeFox Recovery - onyx

on:
  push:
    branches: [main]
    paths:
      - 'device/**'
      - 'vendor/**'
      - '.github/workflows/build-orangefox.yml'
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        type: boolean
        default: false

env:
  DEVICE: onyx
  OF_BRANCH: 14.1

jobs:
  build:
    name: Build OFRP for onyx
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # Step 0: Checkout this repo (device tree + vendor)
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Step 1: Free disk space and add swap
      # ============================================================
      - name: Clean up disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      # ============================================================
      # Step 2: Install build dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          # Use OrangeFox official setup script
          # Clone to 'of_scripts' to avoid conflict with repo's own scripts/ directory
          git clone https://gitlab.com/OrangeFox/misc/scripts of_scripts
          cd of_scripts
          sudo bash setup/android_build_env.sh
          cd ..
          # Additional tools
          sudo apt install -y -qq ccache lz4 xz-utils zstd
          # Configure ccache
          ccache -M 20G
          ccache -o compression=true
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ============================================================
      # Step 3: Sync OrangeFox sources via official sync script
      # ============================================================
      - name: Sync OrangeFox sources
        run: |
          set -e
          echo "=== Cloning OrangeFox sync tool ==="
          git clone https://gitlab.com/OrangeFox/sync.git

          echo "=== Syncing OrangeFox ${{ env.OF_BRANCH }} sources ==="
          cd sync
          ./orangefox_sync.sh --branch ${{ env.OF_BRANCH }} --path ${{ github.workspace }}/orangefox

          echo "=== Sync complete ==="
          echo "Source tree size:"
          du -sh ${{ github.workspace }}/orangefox/ 2>/dev/null || true
          echo "Available disk:"
          df -h / 2>/dev/null || true

      # ============================================================
      # Step 4: Install device tree from this repo
      # ============================================================
      - name: Install device tree
        run: |
          set -e
          echo "=== Copying device tree for onyx ==="
          mkdir -p ${{ github.workspace }}/orangefox/device/xiaomi
          cp -r ${{ github.workspace }}/device/xiaomi/onyx \
                ${{ github.workspace }}/orangefox/device/xiaomi/onyx

          echo "Device tree installed:"
          ls -la ${{ github.workspace }}/orangefox/device/xiaomi/onyx/
          echo "Prebuilt kernel check:"
          ls -lh ${{ github.workspace }}/orangefox/device/xiaomi/onyx/prebuilt/

      # ============================================================
      # Step 5: Build OrangeFox Recovery
      # ============================================================
      - name: Build OrangeFox
        run: |
          set -e
          SOURCE_DIR="${{ github.workspace }}/orangefox"
          cd "$SOURCE_DIR"

          echo "=== Setting up build environment ==="

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export FOX_BUILD_DEVICE="${{ env.DEVICE }}"
          export FOX_BUILD_TYPE="Alpha"
          export OF_USE_LZ4_COMPRESSION=1
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$HOME/.ccache"

          echo "=== System state ==="
          df -h /
          free -h

          echo "=== Initializing build environment ==="
          set +e
          source build/envsetup.sh 2>&1
          ENVSETUP_EXIT=$?
          set -e
          if [ $ENVSETUP_EXIT -ne 0 ]; then
            echo "WARN: envsetup.sh exit code: $ENVSETUP_EXIT (non-fatal, continuing)"
          fi

          # Clean build if requested
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            echo "=== Performing clean build ==="
            make clobber || true
          fi

          echo "=== Lunch: twrp_${{ env.DEVICE }}-ap3a-eng ==="
          lunch "twrp_${{ env.DEVICE }}-ap3a-eng"

          echo "=== Building recoveryimage ==="
          echo "CPU cores: $(nproc --all)"
          mka recoveryimage -j"$(nproc --all)"

          echo "=== Build complete! ==="
          ccache -s 2>/dev/null || true
          echo "Output files:"
          ls -lh out/target/product/${{ env.DEVICE }}/recovery.img 2>/dev/null || echo "(recovery.img not found)"
          ls -lh out/target/product/${{ env.DEVICE }}/OrangeFox*.zip 2>/dev/null || echo "(OrangeFox zip not found)"
          ls -lh out/target/product/${{ env.DEVICE }}/*.img 2>/dev/null || echo "(no images found)"

      # ============================================================
      # Step 6: Upload build artifacts
      # ============================================================
      - name: Upload OrangeFox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-onyx-R12.1
          path: |
            orangefox/out/target/product/onyx/recovery.img
            orangefox/out/target/product/onyx/OrangeFox*.zip
            orangefox/out/target/product/onyx/boot.img
          retention-days: 30
          if-no-files-found: ignore

      # ============================================================
      # Step 7: Build summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          {
            echo "### 🦊 OrangeFox R12.1 | onyx (Redmi Turbo 4 Pro)"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Build | #${{ github.run_id }} |"
            echo "| SOC | Qualcomm SM8735 (Snapdragon 8s Gen 3) |"
            echo "| Kernel | 6.6.77 (prebuilt from device) |"
            echo "| A/B | Virtual A/B, dedicated recovery partition |"
            echo "| Filesystem | EROFS + F2FS + EXT4 |"
            echo "| Dynamic partitions | Yes (super, 11GB) |"
            echo ""
            echo "Download: **Actions** tab → this run → Artifacts section"
          } >> $GITHUB_STEP_SUMMARY
